name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-arm-linux-gnueabi gcc-arm-linux-gnueabi git libncurses5-dev libssl-dev libelf-dev zlib1g-dev cpio

      - name: Setup KernelSU-Next Clean Integration
        run: |
          rm -rf drivers/kernelsu
          git clone https://github.com/KernelSU-Next/KernelSU-Next.git drivers/kernelsu
          
          # Kconfig ve Makefile entegrasyon kontrolü
          if ! grep -q "kernelsu" drivers/Kconfig; then
            echo 'source "drivers/kernelsu/Kconfig"' >> drivers/Kconfig
          fi
          if ! grep -q "kernelsu" drivers/Makefile; then
            echo 'obj-y += kernelsu/' >> drivers/Makefile
          fi

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # 4.14 Çekirdek ve Modern GCC Uyumluluk Bayrakları
          export KCFLAGS="-I$PWD/drivers/devfreq -I$PWD/drivers/misc/mediatek/include -D'syscall_fn_t=void *' -Wno-error=incompatible-pointer-types -Wno-error=implicit-function-declaration -Wno-error=int-conversion"
          
          make a31_defconfig
          make -j$(nproc) Image

      - name: Package Kernel with AnyKernel3
        run: |
          git clone https://github.com/KernelSU-Next/AnyKernel3 -b master anykernel
          cp arch/arm64/boot/Image anykernel/
          cd anykernel
          zip -r9 ../AnyKernel3-a31.zip * -x ".git*" README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-a31
          path: AnyKernel3-a31.zip
