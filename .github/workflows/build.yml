name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Dependencies & Toolchain
        run: |
          sudo dpkg --configure -a
          sudo apt-get update
          sudo apt-get install -f -y
          sudo apt-get install -y bc bison build-essential ccache curl flex g++-aarch64-linux-gnu gcc-aarch64-linux-gnu g++-arm-linux-gnueabi gcc-arm-linux-gnueabi git libncurses5-dev libssl-dev libelf-dev zlib1g-dev cpio
          
          # /tools/build/cpio hatasını engelleme
          sudo mkdir -p /tools/build
          sudo ln -sf /usr/bin/cpio /tools/build/cpio || true

      - name: Setup KernelSU-Next Official Way
        run: |
          rm -rf drivers/kernelsu
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s next || \
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/main/kernel/setup.sh" | bash -s main

      - name: Build Kernel
        run: |
          export ARCH=arm64
          export SUBARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          
          # Tüm eksik başlık dosyası yolları ve uyarı susturucuları tek satırda
          export KCFLAGS="-w -I$PWD/drivers/devfreq -I$PWD/drivers/misc/mediatek/include -I$PWD/drivers/misc/mediatek/video/mt6768/videox -I$PWD/drivers/misc/mediatek/video/common/layering_rule_base/v1.1 -I$PWD/arch/arm64/include -D'syscall_fn_t=void *' -D'__arch_get_mem_evict=0'"
          
          make a31_defconfig
          
          scripts/config --disable CONFIG_IKHEADERS
          scripts/config --disable CONFIG_WERROR
          scripts/config --enable CONFIG_KSU
          
          make -k -j$(nproc) Image || make -j1 Image

      - name: Package Kernel with AnyKernel3
        run: |
          git clone https://github.com/KernelSU-Next/AnyKernel3 -b master anykernel
          cp arch/arm64/boot/Image anykernel/
          cd anykernel
          zip -r9 ../AnyKernel3-a31.zip * -x ".git*" README.md

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-a31
          path: AnyKernel3-a31.zip
