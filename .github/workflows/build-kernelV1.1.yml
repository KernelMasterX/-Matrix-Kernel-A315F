name: Build Kernel

on:
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: /opt/a64/bin/aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  DEFCONFIG: a31_defconfig
  # Repo'nun kendi araci (Samsung/MTK kodu bununla ayarli). Ubuntu clang'i (14+) DWARF5 uretip uyari seli yapiyor.
  CLANG_BIN: ${{ github.workspace }}/toolchain/clang/host/linux-x86/clang-r383902/bin/clang

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git zip cpio \
            libncurses5-dev libssl-dev libelf-dev zlib1g-dev lz4 xz-utils python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi

          # Makefile clang'a --prefix=$(dirname $(which $(CROSS_COMPILE)elfedit)) veriyor ve
          # -no-integrated-as zorluyor. Ubuntu'da bu /usr/bin oluyor, yani clang x86 'as' calistirip
          # "unrecognized option -EL" hatasi aliyor. Cozum: aarch64 binutils'i ayri bir klasore
          # hem prefix'li hem prefix'siz adlarla koy ve CROSS_COMPILE'i mutlak yol yap.
          # (PATH'e eklenmiyor, boylece host gcc etkilenmez.)
          sudo mkdir -p /opt/a64/bin
          for t in as ld ld.bfd ld.gold ar nm strip objcopy objdump readelf elfedit ranlib gcc cpp; do
            src="$(command -v aarch64-linux-gnu-$t || true)"
            [ -n "$src" ] || continue
            sudo ln -sf "$src" "/opt/a64/bin/aarch64-linux-gnu-$t"
            case "$t" in gcc|cpp) ;; *) sudo ln -sf "$src" "/opt/a64/bin/$t";; esac
          done
          ls -l /opt/a64/bin | head -40

      - name: Fix old-kernel vs modern host toolchain
        run: |
          # GCC 10+ ile 4.14 dtc: "multiple definition of yylloc" hatasi
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.lex.c; do
            [ -f "$f" ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
          done
          exit 0

      - name: Integrate KernelSU-Next
        run: |
          rm -rf drivers/kernelsu
          # Yonetici uygulamasi v3.4.2 UAPI 5 konusuyor; legacy'nin ucu (UAPI 6) uyumsuz oldugu icin
          # UAPI 5'in son commit'ine sabitliyoruz (14 Ekim, "port from dev 3.4.2").
          KSU_REF=e3292239f3b8384cc52bdc6f23995d643271a7ce
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s "$KSU_REF"

          test -e drivers/kernelsu || { echo "::error::KernelSU-Next entegrasyonu basarisiz"; exit 1; }

          HEADSHA=$(git -C KernelSU-Next rev-parse HEAD 2>/dev/null || echo unknown)
          echo "KernelSU-Next commit: $HEADSHA"
          [ "$HEADSHA" = "$KSU_REF" ] || { echo "::error::KernelSU-Next sabit commit alinamadi (HEAD=$HEADSHA)"; exit 1; }
          git -C KernelSU-Next log -1 --oneline
          grep -rm1 "define KERNEL_SU_UAPI_VERSION" KernelSU-Next/uapi/ || true
          ls drivers/kernelsu drivers/kernelsu/hook

          grep -q 'kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile \
            || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Patch KernelSU-Next for 4.14
        run: |
          # KSYM_NAME_LEN icin kallsyms.h eksik (supercall/dispatch.c)
          D=drivers/kernelsu/supercall/dispatch.c
          if [ -f "$D" ] && ! grep -q "linux/kallsyms.h" "$D"; then
            sed -i '0,/^#include/s//#include <linux\/kallsyms.h>\n#include/' "$D"
          fi
          # 4.14'te linux/pgtable.h yok
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g'
          grep -n "kallsyms.h" "$D" || true

      - name: Configure Kernel
        run: |
          test -x "$CLANG_BIN" || { echo "::error::Repo clang bulunamadi: $CLANG_BIN"; ls toolchain 2>&1 | head; exit 1; }
          "$CLANG_BIN" --version | head -1
          test -f "arch/arm64/configs/$DEFCONFIG" || { echo "::error::$DEFCONFIG bulunamadi"; ls arch/arm64/configs | head -50; exit 1; }
          make O=out ARCH=arm64 CC=$CLANG_BIN CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$CROSS_COMPILE "$DEFCONFIG"

          C="scripts/config --file out/.config"
          # Samsung korumalari KernelSU ile derlenmez (#error veriyor)
          for o in UH UH_RKP UH_LKMAUTH RKP RKP_CFP RKP_CFP_JOPP RKP_KDP RKP_NS KDP KDP_CRED KDP_NS KDP_TEST SECURITY_DEFEX; do
            $C --disable CONFIG_$o
          done
          $C --enable CONFIG_KSU
          $C --enable CONFIG_MODULES
          $C --enable CONFIG_KPROBES
          $C --enable CONFIG_HAVE_KPROBES
          $C --enable CONFIG_KPROBE_EVENTS
          $C --enable CONFIG_OVERLAY_FS
          $C --disable CONFIG_WERROR
          $C --disable CONFIG_IKHEADERS
          $C --disable CONFIG_DEBUG_INFO
          make O=out ARCH=arm64 CC=$CLANG_BIN CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$CROSS_COMPILE olddefconfig

          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS" out/.config
          if grep -qE "^CONFIG_(UH|KDP|RKP)=y" out/.config; then
            echo "::error::UH/KDP/RKP hala acik (baska bir config select ediyor olabilir)"
            grep -E "^CONFIG_(UH|KDP|RKP)" out/.config
            exit 1
          fi

      - name: Prime KernelSU backports
        run: |
          # KernelSU-Next Kbuild'i, 4.14'te eksik olan path_umount/can_umount'u fs/namespace.c'ye
          # ve seccomp alanini include/linux/seccomp.h'ye DERLEME SIRASINDA ekliyor. fs/ klasoru
          # drivers/'tan once derlendigi icin namespace.o yamasiz kaliyor ve link'te
          # "undefined reference to path_umount" cikiyor. Cozum: yamalari derlemeden ONCE uygula.
          MKP="make O=out ARCH=arm64 CC=$CLANG_BIN CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$CROSS_COMPILE"
          $MKP prepare > prime.log 2>&1 || true
          $MKP drivers/kernelsu/ >> prime.log 2>&1 || true
          grep -E "KSU_NEXT|KernelSU-Next" prime.log | head -20 || true
          grep -q "^int path_umount" fs/namespace.c || { echo "::error::path_umount fs/namespace.c'ye eklenemedi"; tail -n 30 prime.log; exit 1; }
          echo "path_umount yamasi tamam"

      - name: Build Kernel
        run: |
          export KCFLAGS="-w"
          MK="make O=out ARCH=arm64 CC=$CLANG_BIN CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=$CROSS_COMPILE CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          IMG=out/arch/arm64/boot/Image
          CPATH_LIST=""

          for round in 1 2 3 4; do
            echo "===== Tur $round ====="
            set +e
            CPATH="${CPATH_LIST#:}" $MK -k -j"$(nproc)" Image 2>&1 \
              | awk '/Unrecognized form/ { next } { print }' > "build-$round.log"
            set -e
            tail -n 25 "build-$round.log" | cut -c1-250
            [ -f "$IMG" ] && break

            # Eksik header'lari agacta bul, CPATH ile ekle (komut satiri degismez, tam rebuild olmaz)
            grep -ohE "'[^']+\.h' file not found" "build-$round.log" | sed -E "s/^'(.*)' file not found/\1/" | sort -u > missing.txt
            [ -s missing.txt ] || break
            new=0
            while read -r h; do
              mapfile -t hits < <(find drivers sound -path "*/$h" 2>/dev/null | head -n 4)
              if [ "${#hits[@]}" -ge 1 ] && [ "${#hits[@]}" -le 3 ]; then
                for p in "${hits[@]}"; do
                  d="$PWD/${p%/$h}"
                  case ":$CPATH_LIST:" in *":$d:"*) ;; *) CPATH_LIST="$CPATH_LIST:$d"; new=1; echo "include eklendi: $d ($h)";; esac
                done
              else
                echo "atlandi: $h (${#hits[@]} aday)"
              fi
            done < missing.txt
            [ "$new" = 1 ] || break
          done
          cat build-*.log | gzip -9 > build.log.gz

          if [ ! -f "$IMG" ]; then
            echo "::error::Image uretilemedi."
            echo "--- ilk hatalar (benzersiz) ---"
            grep -hE "\*\*\* |undefined reference|ld: |: error|fatal error|No rule to make|No such file" build-*.log \
              | sed -E 's#/home/runner/work/[^/]+/[^/]+/##' | awk '!seen[$0]++' | head -n 40 | cut -c1-250
            exit 1
          fi
          ls -lh "$IMG"

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 anykernel
          cp out/arch/arm64/boot/Image anykernel/Image
          cd anykernel
          rm -rf .git .github README.md

          sed -i 's/^kernel.string=.*/kernel.string=KernelSU-Next kernel for Galaxy A31/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=a31/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=a31nsxx/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=SM-A315F/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh

          zip -r9 ../AnyKernel3-a31.zip * -x ".git*"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-a31
          path: AnyKernel3-a31.zip
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log.gz
          if-no-files-found: ignore
