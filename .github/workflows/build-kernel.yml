name: Build Kernel

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

env:
  ARCH: arm64
  SUBARCH: arm64
  CROSS_COMPILE: aarch64-linux-gnu-
  CROSS_COMPILE_ARM32: arm-linux-gnueabi-
  DEFCONFIG: a31_defconfig

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Maximize Build Space
        uses: easimon/maximize-build-space@v10
        with:
          root-reserve-mb: 512
          swap-size-mb: 2048
          remove-dotnet: 'true'
          remove-android: 'true'
          remove-haskell: 'true'
          remove-codeql: 'true'
          remove-docker-images: 'true'

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison build-essential curl flex git zip cpio \
            libncurses5-dev libssl-dev libelf-dev zlib1g-dev lz4 xz-utils python3 \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu \
            gcc-arm-linux-gnueabi g++-arm-linux-gnueabi \
            clang lld llvm

      - name: Fix old-kernel vs modern host toolchain
        run: |
          # GCC 10+ ile 4.14 dtc: "multiple definition of yylloc" hatasi
          for f in scripts/dtc/dtc-lexer.lex.c_shipped scripts/dtc/dtc-lexer.lex.c; do
            [ -f "$f" ] && sed -i 's/^YYLTYPE yylloc;/extern YYLTYPE yylloc;/' "$f"
          done
          exit 0

      - name: Integrate KernelSU-Next
        run: |
          rm -rf drivers/kernelsu
          # 4.14 icin 'legacy' dali sart. 'next'/'dev' dallari GKI (5.10+) icindir.
          curl -LSs "https://raw.githubusercontent.com/KernelSU-Next/KernelSU-Next/next/kernel/setup.sh" | bash -s legacy

          test -e drivers/kernelsu || { echo "::error::KernelSU-Next entegrasyonu basarisiz"; exit 1; }

          BR=$(git -C KernelSU-Next rev-parse --abbrev-ref HEAD 2>/dev/null || echo unknown)
          echo "KernelSU-Next dali: $BR"
          [ "$BR" = "legacy" ] || { echo "::error::legacy dali alinamadi (HEAD=$BR)"; exit 1; }
          git -C KernelSU-Next log -1 --oneline
          ls drivers/kernelsu drivers/kernelsu/hook

          grep -q 'kernelsu/Kconfig' drivers/Kconfig \
            || sed -i '$i source "drivers/kernelsu/Kconfig"' drivers/Kconfig
          grep -q 'kernelsu' drivers/Makefile \
            || echo 'obj-$(CONFIG_KSU) += kernelsu/' >> drivers/Makefile

      - name: Patch KernelSU-Next for 4.14
        run: |
          # KSYM_NAME_LEN icin kallsyms.h eksik (supercall/dispatch.c)
          D=drivers/kernelsu/supercall/dispatch.c
          if [ -f "$D" ] && ! grep -q "linux/kallsyms.h" "$D"; then
            sed -i '0,/^#include/s//#include <linux\/kallsyms.h>\n#include/' "$D"
          fi
          # 4.14'te linux/pgtable.h yok
          grep -rl "linux/pgtable.h" drivers/kernelsu/ 2>/dev/null | xargs -r sed -i 's|<linux/pgtable.h>|<asm/pgtable.h>|g'
          grep -n "kallsyms.h" "$D" || true

      - name: Configure Kernel
        run: |
          test -f "arch/arm64/configs/$DEFCONFIG" || { echo "::error::$DEFCONFIG bulunamadi"; ls arch/arm64/configs | head -50; exit 1; }
          make O=out ARCH=arm64 CC=clang "$DEFCONFIG"

          C="scripts/config --file out/.config"
          # Samsung korumalari KernelSU ile derlenmez (#error veriyor)
          for o in UH UH_RKP UH_LKMAUTH RKP RKP_CFP RKP_CFP_JOPP RKP_KDP RKP_NS KDP KDP_CRED KDP_NS KDP_TEST SECURITY_DEFEX; do
            $C --disable CONFIG_$o
          done
          $C --enable CONFIG_KSU
          $C --enable CONFIG_MODULES
          $C --enable CONFIG_KPROBES
          $C --enable CONFIG_HAVE_KPROBES
          $C --enable CONFIG_KPROBE_EVENTS
          $C --enable CONFIG_OVERLAY_FS
          $C --disable CONFIG_WERROR
          $C --disable CONFIG_IKHEADERS
          make O=out ARCH=arm64 CC=clang olddefconfig

          grep -E "CONFIG_KSU|CONFIG_KPROBES|CONFIG_HAVE_KPROBES|CONFIG_KPROBE_EVENTS" out/.config
          if grep -qE "^CONFIG_(UH|KDP|RKP)=y" out/.config; then
            echo "::error::UH/KDP/RKP hala acik (baska bir config select ediyor olabilir)"
            grep -E "^CONFIG_(UH|KDP|RKP)" out/.config
            exit 1
          fi

      - name: Build Kernel
        run: |
          export KCFLAGS="-w"
          MK="make O=out ARCH=arm64 CC=clang CLANG_TRIPLE=aarch64-linux-gnu- CROSS_COMPILE=aarch64-linux-gnu- CROSS_COMPILE_ARM32=arm-linux-gnueabi-"
          IMG=out/arch/arm64/boot/Image
          CPATH_LIST=""

          for round in 1 2 3 4; do
            echo "===== Tur $round ====="
            set +e
            CPATH="${CPATH_LIST#:}" $MK -k -j"$(nproc)" Image 2>&1 | tee "build-$round.log"
            set -e
            [ -f "$IMG" ] && break

            # Eksik header'lari agacta bul, CPATH ile ekle (komut satiri degismez, tam rebuild olmaz)
            grep -ohE "'[^']+\.h' file not found" "build-$round.log" | sed -E "s/^'(.*)' file not found/\1/" | sort -u > missing.txt
            [ -s missing.txt ] || break
            new=0
            while read -r h; do
              mapfile -t hits < <(find drivers sound -path "*/$h" 2>/dev/null | head -n 4)
              if [ "${#hits[@]}" -ge 1 ] && [ "${#hits[@]}" -le 3 ]; then
                for p in "${hits[@]}"; do
                  d="$PWD/${p%/$h}"
                  case ":$CPATH_LIST:" in *":$d:"*) ;; *) CPATH_LIST="$CPATH_LIST:$d"; new=1; echo "include eklendi: $d ($h)";; esac
                done
              else
                echo "atlandi: $h (${#hits[@]} aday)"
              fi
            done < missing.txt
            [ "$new" = 1 ] || break
          done
          cat build-*.log > build.log

          if [ ! -f "$IMG" ]; then
            echo "::error::Image uretilemedi. Kalan hatalar:"
            grep -hE "error:|fatal error" build-*.log | sort | uniq -c | sort -rn | head -n 40
            exit 1
          fi
          ls -lh "$IMG"

      - name: Package with AnyKernel3
        run: |
          git clone --depth 1 https://github.com/osm0sis/AnyKernel3 anykernel
          cp out/arch/arm64/boot/Image anykernel/Image
          cd anykernel
          rm -rf .git .github README.md

          sed -i 's/^kernel.string=.*/kernel.string=KernelSU-Next kernel for Galaxy A31/' anykernel.sh
          sed -i 's/^device.name1=.*/device.name1=a31/' anykernel.sh
          sed -i 's/^device.name2=.*/device.name2=a31nsxx/' anykernel.sh
          sed -i 's/^device.name3=.*/device.name3=SM-A315F/' anykernel.sh
          sed -i 's/^device.name4=.*/device.name4=/' anykernel.sh
          sed -i 's/^device.name5=.*/device.name5=/' anykernel.sh
          sed -i 's|^BLOCK=.*|BLOCK=/dev/block/by-name/boot;|' anykernel.sh
          sed -i 's/^IS_SLOT_DEVICE=.*/IS_SLOT_DEVICE=0;/' anykernel.sh

          zip -r9 ../AnyKernel3-a31.zip * -x ".git*"

      - name: Upload Kernel Zip
        uses: actions/upload-artifact@v4
        with:
          name: AnyKernel3-a31
          path: AnyKernel3-a31.zip
          if-no-files-found: error

      - name: Upload Build Log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: ignore
